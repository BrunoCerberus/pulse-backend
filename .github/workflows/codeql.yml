name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # Per-language context so each is distinct and individually requireable:
    # "CodeQL go" / "CodeQL javascript-typescript".
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Analyze every language even if one fails — a Go failure must not hide
      # a TypeScript finding (or vice versa).
      fail-fast: false
      matrix:
        include:
          # Go: compiled — autobuild produces the database.
          - language: go
            build-mode: autobuild
          # TypeScript (Deno Edge Functions): interpreted — no build step.
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended over the default suite. The default trades recall
          # for precision, which is the wrong trade for this codebase: the whole
          # threat model is hostile attacker-controlled input flowing through
          # feed parsing, HTML extraction, and URL handling (see THREAT_MODEL.md),
          # and the extra queries are largely the deeper taint-tracking ones.
          # Expect a somewhat higher false-positive rate — findings land in the
          # Security tab, and CodeQL does not fail the build on alerts, so the
          # cost of a noisy query is triage, not a blocked merge.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

      - name: Annotate CodeQL result
        if: success()
        shell: bash
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          echo "::notice title=CodeQL::${LANGUAGE} analysis complete — results in the Security tab"
          {
            echo "## CodeQL (${LANGUAGE}) ✅"
            echo ""
            echo "- Language: ${LANGUAGE}"
            echo "- Findings (if any) are reported in the repository Security tab"
          } >> "$GITHUB_STEP_SUMMARY"
