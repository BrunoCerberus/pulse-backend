name: Migrations CI

# Applies every Supabase migration from scratch in the Supabase local stack and
# asserts security invariants against the resulting schema. The migrations
# reference Supabase-managed roles (anon, authenticated, service_role,
# authenticator) and the `request.jwt.claims` request GUC, so they can only be
# applied via the local stack — a bare Postgres lacks those roles.
#
# Two jobs:
#   - `Apply migrations + invariants` — schema validation (see below).
#   - `Edge Function contract tests` — the Deno unit tests exercise handlers
#     with synthetic Requests; they can never see a real Postgres, RLS, or the
#     views the functions actually query. This job boots the local stack,
#     applies every migration, and hits all six endpoints over HTTP with the
#     same status/shape/Cache-Control assertions the production deploy smoke
#     test uses — so cross-layer drift fails the PR instead of the release.
#
# This workflow runs on EVERY PR/push to master (no path filter) so both
# contexts always report and can be required status checks without deadlocking
# unrelated PRs. The expensive Supabase-stack work is gated internally: each
# job runs only when its inputs (migrations / config / tests / functions, or
# this workflow) changed, and is skipped-but-green otherwise.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; let push/dispatch runs on master finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shared change detection: one paths-filter run whose outputs gate BOTH jobs.
  # (A separate paths-filter per job would duplicate the filter lists and let
  # them drift.) Always runs and always reports, so both contexts exist on
  # every PR and can be required checks without deadlocking unrelated PRs.
  changes:
    name: Detect related changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      run-contract: ${{ steps.decide.outputs.run-contract }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: paths-filter diffs against the base on push events.
          fetch-depth: 0

      # Skipped on workflow_dispatch (which always force-runs both jobs below).
      - name: Detect related changes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            schema:
              - 'supabase/migrations/**'
              - 'supabase/config.toml'
              - 'supabase/tests/**'
              - '.github/workflows/migrations-ci.yml'
            functions:
              - 'supabase/functions/**'
              - 'supabase/config.toml'
              - '.github/workflows/migrations-ci.yml'

      - name: Decide which jobs run
        id: decide
        shell: bash
        env:
          CHANGED_SCHEMA: ${{ steps.changes.outputs.schema }}
          CHANGED_FUNCTIONS: ${{ steps.changes.outputs.functions }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # schema → full validation; schema OR functions → contract tests
          # (the functions and the views they read drift together, so a
          # migration must be re-verified against them).
          if [ "$CHANGED_SCHEMA" = "true" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$CHANGED_SCHEMA" = "true" ] || [ "$CHANGED_FUNCTIONS" = "true" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run-contract=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-contract=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Apply migrations + invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the incremental-apply step below can diff this PR's
          # migrations against the base branch.
          fetch-depth: 0

      - name: Set up Supabase CLI
        if: needs.changes.outputs.run == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Pinned, not "latest" (setup-cli's default): the steps below were
          # validated against 2.116.0, and a silent CLI upgrade that changes
          # `db reset` / `db lint` semantics would break this job for reasons
          # it cannot explain. Bump deliberately; the weekly toolchain-freshness
          # check tracks the latest release.
          version: "2.116.0"

      - name: Start local Postgres
        if: needs.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Docker is preinstalled on ubuntu-latest; this boots the Supabase
          # local Postgres (and supporting containers) in Docker.
          supabase db start

      - name: Apply migrations from scratch
        if: needs.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # CORE CHECK: drops and re-applies every migration from scratch.
          # Exits non-zero on ANY SQL error, so a broken or out-of-order
          # migration fails the build here.
          supabase db reset --no-seed

      # `db reset` above proves the set applies from SCRATCH. Production never
      # does that — it applies migration N on top of a live schema, which is a
      # materially different operation: a migration can be valid against an
      # empty database and still fail against one that already holds data and
      # objects (a NOT NULL added to a populated column, a UNIQUE index over
      # existing duplicates, a DROP of something an earlier migration renamed).
      #
      # This step reproduces the production path: rewind to the base branch's
      # migrations, apply those, then apply ONLY this PR's new migrations on
      # top. It runs on pull_request events, where the base is well defined —
      # a push to master has already been through this on the PR.
      - name: Apply new migrations incrementally
        id: incremental
        if: needs.changes.outputs.run == 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          dir=supabase/migrations
          staging=$(mktemp -d)

          # Only ADDED files: a PR that edits an already-applied migration is a
          # different (and worse) problem, and the from-scratch reset above is
          # what catches that.
          mapfile -t new_files < <(git diff --name-only --diff-filter=A \
            "$BASE_SHA" HEAD -- "$dir" | grep -E '\.sql$' || true)

          if [ "${#new_files[@]}" -eq 0 ]; then
            echo "::notice title=Migrations CI::no new migrations in this PR — incremental apply not applicable"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New migrations in this PR:"
          printf '  %s\n' "${new_files[@]}"

          # Rewind: park the new files outside the migrations directory so the
          # reset below reconstructs exactly the base branch's schema.
          for f in "${new_files[@]}"; do
            mv "$f" "$staging/"
          done

          echo "--- Applying base-branch migrations only ---"
          supabase db reset --no-seed

          # Restore and apply just the new ones, the way production will.
          for f in "${new_files[@]}"; do
            mv "$staging/$(basename "$f")" "$f"
          done

          echo "--- Applying this PR's migrations on top ---"
          supabase migration up --local

          echo "ran=true" >> "$GITHUB_OUTPUT"
          {
            echo "count=${#new_files[@]}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Migrations CI::${#new_files[@]} new migration(s) applied incrementally on top of the base-branch schema"

      - name: Lint plpgsql
        if: needs.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # plpgsql type/lint pass over the applied schema. Fails the step on
          # any error-level finding (warnings are reported but non-fatal).
          supabase db lint --level warning --fail-on error

      - name: Run security invariants
        id: invariants
        if: needs.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # pipefail so a failed psql assertion isn't masked by tee's success.
          # ON_ERROR_STOP=1 makes any RAISE EXCEPTION in the script abort psql
          # with a non-zero exit.
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/security_invariants.sql 2>&1 | tee /tmp/invariants.log

      # Surface the outcome in the Annotations box + Job Summary. always() so a
      # failed run still annotates, but branch on the invariants step's outcome
      # (psql can print partial output before aborting) so a red run never shows
      # a green check. Matches the always()+outcome pattern in
      # fetch-rss.yml / test.yml.
      - name: Annotate migrations CI result
        if: always()
        shell: bash
        env:
          RUN_VALIDATION: ${{ needs.changes.outputs.run }}
          INVARIANTS_OUTCOME: ${{ steps.invariants.outcome }}
          INCREMENTAL_RAN: ${{ steps.incremental.outputs.ran }}
          INCREMENTAL_COUNT: ${{ steps.incremental.outputs.count }}
        run: |
          set -euo pipefail
          if [ "$RUN_VALIDATION" != "true" ]; then
            echo "::notice title=Migrations CI::no schema/config/test changes — full validation skipped"
            {
              echo "## Migrations CI ⏭️"
              echo ""
              echo "- No changes under \`supabase/migrations\`, \`supabase/config.toml\`, or \`supabase/tests\` — the apply-from-scratch + lint + invariants suite was skipped (nothing to verify)."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$INVARIANTS_OUTCOME" = "success" ]; then
            # Count migrations from the tree rather than hardcoding a number
            # that rots every time a migration lands.
            migration_count=$(find supabase/migrations -name '*.sql' | wc -l | tr -d ' ')

            if [ "${INCREMENTAL_RAN:-}" = "true" ]; then
              incremental_line="- Incremental apply: ${INCREMENTAL_COUNT} new migration(s) applied on top of the base-branch schema (\`supabase migration up\`) — the path production takes"
            else
              incremental_line="- Incremental apply: not applicable (no migrations added in this change)"
            fi

            echo "::notice title=Migrations CI::${migration_count} migrations applied from scratch · db lint clean · security invariants passed"
            {
              echo "## Migrations CI ✅"
              echo ""
              echo "- Apply-from-scratch: all ${migration_count} migrations (\`supabase db reset --no-seed\`) applied with no SQL error"
              echo "${incremental_line}"
              echo "- plpgsql lint: no error-level findings (\`supabase db lint --fail-on error\`)"
              echo "- Security invariants (supabase/tests/security_invariants.sql): RLS on articles + fetch_logs + sources + categories · SECURITY DEFINER funcs pin empty search_path · write functions are SECURITY DEFINER · write funcs carry the JWT-claim gate + anon/authenticated EXECUTE revoked · search_articles length cap + bounded projection · articles_with_source hides url_hash · base-table articles column grant hides url_hash/backfill · sources/categories writes revoked · sources operational columns revoked · security_invoker on views"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            tail=""
            [ -f /tmp/invariants.log ] && tail=$(grep -E 'INVARIANT|caller-gate|ERROR|FAILED' /tmp/invariants.log | tail -1 || true)
            echo "::error title=Migrations CI::invariants outcome ${INVARIANTS_OUTCOME}${tail:+ — ${tail}}"
            {
              echo "## Migrations CI ❌"
              echo ""
              echo "- Invariants step outcome: **${INVARIANTS_OUTCOME}**"
              echo "- Last failure line: ${tail:-none captured (failure may be in an earlier step — see logs)}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Edge Function contract tests (see the header comment for the rationale).
  #
  # Deliberately a separate job from `validate`: validate runs
  # `supabase db start` (Postgres only — the functions need the gateway +
  # PostgREST + the Edge Runtime container that `supabase start` serves them
  # from), and booting the full stack inside validate would slow the migration
  # check for every PR. Gated on the shared `changes` job's run-contract
  # output: runs when migrations, config, tests, OR functions changed.
  # ---------------------------------------------------------------------------
  functions-contract:
    name: Edge Function contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        if: needs.changes.outputs.run-contract == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Pinned, not "latest" (setup-cli's default): the steps below were
          # validated against 2.116.0, and a silent CLI upgrade that changes
          # `start` / `db reset` / Edge-Runtime semantics would break
          # assertions this job cannot explain. Bump deliberately; the weekly
          # toolchain-freshness check tracks the latest release.
          version: "2.116.0"

      - name: Start local Supabase stack
        if: needs.changes.outputs.run-contract == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Minimal stack: the functions need the gateway (kong) + PostgREST +
          # Postgres + the Edge Runtime container that `supabase start` serves
          # the repo's functions from. Everything else (studio, imgproxy,
          # storage, …) is excluded — it only costs image pulls and RAM.
          # --yes: non-interactive CI — a future CLI prompt must never hang
          # the job until timeout.
          supabase start --yes \
             -x gotrue -x realtime -x storage-api -x imgproxy -x mailpit \
             -x postgres-meta -x studio -x logflare -x vector -x supavisor

      - name: Apply migrations
        if: needs.changes.outputs.run-contract == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Same apply-from-scratch as validate: the contract assertions run
          # against the real schema, not a hand-built approximation.
          # --yes: non-interactive CI — never hang on a confirmation prompt.
          supabase db reset --no-seed --yes

      - name: Wait for gateway + functions
        if: needs.changes.outputs.run-contract == 'true'
        shell: bash
        run: |
          set -uo pipefail
          # `db reset` restarts the containers; the gateway needs a few
          # seconds to come back. api-health is the cheapest full-path probe
          # (kong → edge runtime → function) and does not touch the DB.
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 http://localhost:54321/functions/v1/api-health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "gateway + functions ready (after $i probe(s))"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Functions Contract::gateway did not return healthy after migrations were applied"
          exit 1

      - name: Contract-check all six endpoints
        id: contract
        if: needs.changes.outputs.run-contract == 'true'
        shell: bash
        run: |
          set -uo pipefail

          # Same six endpoints, same assertions as the production deploy smoke
          # test in deploy.yml (status, body shape, Cache-Control) — run
          # against the local stack with the real schema, so cross-layer
          # drift fails the PR instead of the release.
          checks=$(cat <<'CHECKS'
          api-categories^api-categories?limit=1^type == "array"^public, max-age=86400
          api-sources^api-sources?limit=1^type == "array"^public, max-age=3600
          api-articles^api-articles?limit=1^type == "array"^public, max-age=900, stale-while-revalidate=1800
          api-search^api-search?q=test&limit=1^type == "array"^private, max-age=60
          api-health^api-health^.status == "ok"^no-store
          api-source-health^api-source-health^has("summary") and (.summary | has("total"))^public, max-age=60
          CHECKS
          )

          failed=0
          results=""

          while IFS='^' read -r name path assertion want_cc; do
            [ -z "$name" ] && continue

            hdr=$(mktemp)

            # No -f: a non-2xx must be reported as a status mismatch, not
            # swallowed as a curl error. Body goes to a file so stdout carries
            # only the status code. "000" means curl never got a response.
            status=$(curl -sS --max-time 20 -D "$hdr" -w '%{http_code}' \
                       -o /tmp/contract-body.json \
                       "http://localhost:54321/functions/v1/${path}" 2>/dev/null || echo "000")
            body=$(cat /tmp/contract-body.json 2>/dev/null || true)

            # Header names are case-insensitive; normalise, then collapse the
            # header's internal whitespace so ", " vs "," never fails a match.
            got_cc=$(grep -i '^cache-control:' "$hdr" | tail -1 \
              | cut -d: -f2- | tr -d '\r' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/,[[:space:]]*/, /g')
            rm -f "$hdr"

            problems=""
            # 206 is a success here: PostgREST answers Partial Content whenever
            # a `limit` makes the response a subset of the matching rows.
            if [ "$status" != "200" ] && [ "$status" != "206" ]; then
              problems="${problems} status=${status} (want 200 or 206);"
            fi

            if ! printf '%s' "$body" | jq -e "$assertion" >/dev/null 2>&1; then
              problems="${problems} body failed assertion \`${assertion}\`;"
            fi

            if [ "$got_cc" != "$want_cc" ]; then
              problems="${problems} Cache-Control='${got_cc}' (want '${want_cc}');"
            fi

            if [ -n "$problems" ]; then
              failed=1
              echo "::error title=Functions Contract::${name} —${problems}"
              echo "  body (first 300 chars): $(printf '%s' "$body" | head -c 300)"
              results="${results}| \`${name}\` | ❌ |${problems} |"$'\n'
            else
              echo "${name}: OK (${status}, shape ok, Cache-Control ok)"
              results="${results}| \`${name}\` | ✅ | ${status} · shape ok · \`${want_cc}\` |"$'\n'
            fi
          done <<< "$checks"

          # Written to a file (not GITHUB_OUTPUT) so the Annotate step below
          # can render it on BOTH paths; an empty file means the step never
          # got far enough to check anything.
          {
            echo "| Endpoint | Result | Detail |"
            echo "|----------|--------|--------|"
            printf '%s' "$results"
          } > /tmp/contract-results.md

          if [ "$failed" -ne 0 ]; then
            echo "::error title=Functions Contract::one or more endpoints failed against the local stack"
            exit 1
          fi
          echo "All 6 endpoints passed the local contract check."

      # Branch on the contract step's outcome so a red run never shows a green
      # check; always() so a failed EARLIER step (stack, reset, wait) still
      # gets an annotation explaining the job is red.
      - name: Annotate contract result
        if: always()
        shell: bash
        env:
          RUN_CONTRACT: ${{ needs.changes.outputs.run-contract }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
        run: |
          set -euo pipefail
          if [ "$RUN_CONTRACT" != "true" ]; then
            echo "::notice title=Functions Contract::no schema/config/function changes — contract tests skipped"
            {
              echo "## Edge Function contract tests ⏭️"
              echo ""
              echo "- No changes under \`supabase/migrations\`, \`supabase/functions\`, \`supabase/config.toml\`, or \`supabase/tests\` — the local-stack endpoint contract suite was skipped (nothing to verify)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          results=""
          [ -f /tmp/contract-results.md ] && results=$(cat /tmp/contract-results.md)

          if [ "$CONTRACT_OUTCOME" = "success" ]; then
            echo "::notice title=Functions Contract::all 6 endpoints passed against the local stack (real schema)"
            {
              echo "## Edge Function contract tests ✅"
              echo ""
              echo "- Full local stack (Postgres + PostgREST + Kong + Edge Runtime) with every migration applied"
              echo "- All 6 endpoints returned 200 with the expected shape and \`Cache-Control\` — the same assertions as the production deploy smoke test"
              echo ""
              echo "$results"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Functions Contract::contract check ${CONTRACT_OUTCOME} — see the step annotations above"
            {
              echo "## Edge Function contract tests ❌"
              echo ""
              echo "- Contract step outcome: **${CONTRACT_OUTCOME}**"
              echo ""
              echo "${results:-no results captured — a step before the endpoint checks failed (see logs)}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
