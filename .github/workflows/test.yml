name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs to save CI minutes; never cancel a push-to-master
# run (those gate the required checks).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go-worker

      # One pass, not two: the race detector and the coverage profile are
      # independent instrumentation and compose fine, so running the suite
      # twice only bought a second compile of the same test binaries.
      - name: Run tests with race detector + coverage
        working-directory: ./rss-worker
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Display coverage summary
        working-directory: ./rss-worker
        run: go tool cover -func=coverage.out

      - name: Enforce 100% coverage
        working-directory: ./rss-worker
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')
          if [ "$total" != "100.0%" ]; then
            echo "::error::Total coverage $total is below the 100.0% threshold"
            echo ""
            echo "Functions below 100%:"
            go tool cover -func=coverage.out | awk '$NF != "100.0%" && !/^total:/'
            exit 1
          fi
          # Populate the Annotations box + Job Summary on the green path. The
          # race-detector step ran (and passed) earlier in this job.
          echo "::notice title=Go Tests::race detector passed · total coverage ${total}"
          {
            echo "## Go Tests ✅"
            echo ""
            echo "- Race detector: passed"
            echo "- Total coverage: **${total}**"
            echo ""
            echo "<details><summary>Per-function coverage</summary>"
            echo ""
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # govulncheck deliberately does NOT run here. It runs in security.yml's
      # `Go Vulnerabilities (govulncheck)` job, on the same push/PR triggers
      # plus a weekly cron — running it in both places was the same scan, with
      # the same action pin and the same inputs, billed twice per PR.

  fuzz:
    name: Go Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go-worker

      # Short, bounded smoke run on every PR. The seed corpora in
      # testdata/fuzz/ already replay as ordinary subtests in the Go Tests job;
      # this job spends a fixed budget looking for NEW inputs. The long hunt
      # lives in fuzz.yml (nightly), so keep FUZZTIME small enough that a PR
      # never waits on it.
      #
      # Targets are discovered, not listed: adding a func FuzzXxx anywhere in
      # the module enrolls it here automatically. `go test` requires one -fuzz
      # target per invocation, hence the loop.
      - name: Fuzz hostile-input surfaces
        id: fuzz
        working-directory: ./rss-worker
        env:
          FUZZTIME: 20s
        run: |
          set -uo pipefail
          fuzz_status=0
          {
            echo "## Go Fuzz"
            echo ""
            echo "| Target | Package | Result |"
            echo "|--------|---------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          found=0
          while IFS= read -r file; do
            pkg=$(dirname "$file")
            # GNU grep -r (the runner) prefixes paths with "./", BSD
            # grep (macOS) does not; strip it so the go test path is
            # well-formed on both.
            pkg=${pkg#./}
            while IFS= read -r target; do
              found=$((found + 1))
              echo "::group::${target} (${pkg}, ${FUZZTIME})"
              if go test -run '^$' -fuzz "^${target}\$" -fuzztime "$FUZZTIME" "./${pkg}"; then
                echo "| \`${target}\` | ${pkg} | ✅ |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error title=Go Fuzz::${target} found a failing input — the minimized crasher is in ${pkg}/testdata/fuzz/${target}/"
                echo "| \`${target}\` | ${pkg} | ❌ |" >> "$GITHUB_STEP_SUMMARY"
                fuzz_status=1
              fi
              echo "::endgroup::"
            done < <(grep -oE '^func Fuzz[A-Za-z0-9_]*' "$file" | sed -E 's/^func //')
          done < <(grep -rl --include='*_test.go' -E '^func Fuzz[A-Za-z0-9_]*\(' .)
          if [ "$found" -eq 0 ]; then
            echo "::error title=Go Fuzz::no fuzz targets found — the discovery grep matched nothing, so this job was silently vacuous"
            exit 1
          fi
          echo "Ran $found fuzz target(s) for $FUZZTIME each."
          if [ "$fuzz_status" -eq 0 ]; then
            echo "::notice title=Go Fuzz::$found target(s) × $FUZZTIME — no failing inputs"
          fi
          exit "$fuzz_status"

      # A crasher is only actionable with the input that produced it. Go writes
      # the minimized case under testdata/fuzz/<Target>/; publish it so the fix
      # can start by committing that file as a permanent seed.
      - name: Upload failing fuzz inputs
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: rss-worker/**/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 30

  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go-worker

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned so a compromise of the golangci-lint release pipeline
          # can't land a malicious binary on the next run. Bump via
          # Dependabot (config in .github/dependabot.yml).
          version: v2.4.0
          working-directory: ./rss-worker

      # golangci-lint annotates its own findings on failure; this records the
      # clean pass. if:success() means it's skipped (not run) when lint fails.
      - name: Annotate lint result
        if: success()
        shell: bash
        run: |
          echo "::notice title=Go Lint::golangci-lint v2.4.0 passed — no findings"
          {
            echo "## Go Lint ✅"
            echo ""
            echo "- golangci-lint **v2.4.0**: no findings"
          } >> "$GITHUB_STEP_SUMMARY"

  deno-tests:
    name: Deno Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Pin to a concrete release so a compromise of Deno's release
          # channel can't push a malicious binary into CI on the next run.
          # Must be a 2.x release because deno.lock is on lockfile version 5
          # (Deno 1.x only handles v3/4). Keep this in step with the version
          # developers run locally: `deno fmt` output can shift between minor
          # releases, so a drift here shows up as a CI-only format failure.
          deno-version: v2.9.4
          # Cache the dependency download (DENO_DIR), keyed on deno.lock, so
          # repeat runs don't re-fetch every imported std module.
          cache: true

      - name: Lint + format-check Edge Functions
        working-directory: ./supabase/functions
        # deno fmt --check enforces formatting; deno lint catches unused vars,
        # no-explicit-any, etc. across the Edge Functions and their tests.
        run: |
          set -euo pipefail
          deno fmt --check
          deno lint
          echo "::notice title=Deno Lint::deno fmt --check + deno lint passed — no findings"
          {
            echo "## Deno Lint + Format ✅"
            echo ""
            echo "- deno fmt --check: all files formatted"
            echo "- deno lint: no findings"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Edge Function tests
        id: deno
        working-directory: ./supabase/functions
        # `--frozen` makes the build fail if any imported URL drifts from the
        # committed `deno.lock`, blocking a hijacked deno.land/std module
        # from slipping into CI silently.
        run: |
          set -o pipefail
          deno test --frozen --allow-env --allow-net --coverage=cov_profile _shared/ api-articles/ api-categories/ api-sources/ api-search/ api-health/ api-source-health/ 2>&1 | tee /tmp/deno-test.log

      # Enforce a line-coverage floor on the Edge Functions (currently ~96.8%).
      # Mirrors the Go side's coverage gate so the TS layer can't silently
      # regress. Floor is set below today's number to leave normal headroom.
      - name: Check Edge Function coverage
        if: success()
        working-directory: ./supabase/functions
        shell: bash
        env:
          DENO_COVERAGE_FLOOR: "90.0"
        run: |
          set -euo pipefail
          report=$(deno coverage cov_profile | sed -E 's/\x1b\[[0-9;]*m//g')
          echo "$report"
          # Locate the "Line %" column from the HEADER row, then read that column
          # from the "All files" total row. Keying off the header (rather than a
          # fixed field offset) means a future Deno release that reorders or adds
          # table columns breaks loudly here instead of silently reading the
          # wrong number and rendering the floor check meaningless.
          line=$(printf '%s\n' "$report" | awk -F'|' '
            /Branch %/ && /Line %/ {
              for (i = 1; i <= NF; i++) { h = $i; gsub(/^[ \t]+|[ \t]+$/, "", h); if (h == "Line %") col = i }
            }
            /All files/ && col { v = $col; gsub(/[^0-9.]/, "", v); print v; exit }
          ')
          if [ -z "$line" ]; then
            echo "::error title=Deno Tests::could not parse the Line %% column from \`deno coverage\` output — the table format may have changed"
            exit 1
          fi
          echo "Total Edge Function line coverage: ${line}% (floor ${DENO_COVERAGE_FLOOR}%)"
          if ! awk -v c="$line" -v f="$DENO_COVERAGE_FLOOR" 'BEGIN { exit !(c+0 >= f+0) }'; then
            echo "::error title=Deno Tests::Edge Function line coverage ${line}% is below the ${DENO_COVERAGE_FLOOR}% floor"
            exit 1
          fi
          {
            echo "## Deno Coverage ✅"
            echo ""
            echo "- Total line coverage: **${line}%** (floor ${DENO_COVERAGE_FLOOR}%)"
          } >> "$GITHUB_STEP_SUMMARY"

      # deno prints a final tally ("ok | N passed | M failed (…)") on both
      # success and failure. Branch on the run step's outcome so the annotation
      # is honest about which one happened.
      - name: Annotate Deno test result
        if: always()
        shell: bash
        env:
          DENO_OUTCOME: ${{ steps.deno.outcome }}
        run: |
          log=/tmp/deno-test.log
          summary=""
          [ -f "$log" ] && summary=$(grep -oE '(ok|FAILED) \| [0-9]+ passed.*' "$log" | tail -1 || true)
          if [ "$DENO_OUTCOME" = "success" ]; then
            echo "::notice title=Deno Tests::${summary:-all tests passed}"
            {
              echo "## Deno Tests ✅"
              echo ""
              echo "- ${summary:-all tests passed}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Deno Tests::${summary:-tests failed — see logs}"
            {
              echo "## Deno Tests ❌"
              echo ""
              echo "- ${summary:-tests failed — see logs}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
