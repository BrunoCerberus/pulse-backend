name: Deploy

# Single gated production deploy: apply DB migrations FIRST, then deploy Edge
# Functions, then smoke-test api-health. Steps run sequentially under `set -e`,
# so a failed `supabase db push` aborts the job before any function ships —
# that ordering is the whole point.
#
# There is deliberately NO automated rollback: if the smoke test fails, the new
# migrations and functions are already live. Posture is fix-forward — a red
# run here means "production may be broken, fix it now", not "nothing
# changed". Rolling back applied migrations automatically is riskier than the
# failure modes it would cover. As a manual safety net, the `Back up database`
# step dumps schema + data, encrypts them with BACKUP_ENCRYPTION_KEY, and
# uploads the `.enc` files as the `pre-deploy-backup-<sha>` artifact (30-day
# retention) BEFORE any migration runs. The dump crosses the C-GRANT boundary
# (it is taken with the DB password), so it must not land in a repo-readable
# artifact unencrypted.
#
# The `preflight` job gates the deploy on Tests + Migrations CI being green for
# the exact commit (fails closed on a red or missing run; skipped on manual
# dispatch). If a `staging` Environment is configured (repo variable
# STAGING_ENABLED=true + STAGING_SUPABASE_* secrets), `deploy-staging` runs the
# whole migrate/deploy/contract path there first; otherwise it is skipped and
# production proceeds unchanged.
#
# Gated on the `production` GitHub Environment (Settings → Environments →
# production: required reviewers + branch restriction to master). One approval
# covers the entire DB-and-functions deploy. The Environment also scopes the
# Supabase secrets so they aren't exposed to other workflows.
#
# Required secrets on the `production` Environment:
#   SUPABASE_ACCESS_TOKEN  - Personal access token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   - Project reference ID from Supabase project settings
#   SUPABASE_DB_PASSWORD   - DB password from Project Settings → Database; required by
#                            `supabase db push`. If absent, the migrate step FAILS the deploy
#                            (functions are never shipped without their migrations) — see "Apply migrations".
#   SUPABASE_URL           - (repo scope, reused) used by the post-deploy smoke test.
#   BACKUP_ENCRYPTION_KEY  - passphrase (e.g. `openssl rand -base64 32`) used to encrypt the
#                            pre-deploy dump before it is uploaded as an artifact. If absent,
#                            the backup step FAILS the deploy — the dump contains service-role-
#                            only columns and must never be uploaded in the clear.
#
# Optional `staging` Environment (only if the repo variable STAGING_ENABLED=true):
#   STAGING_SUPABASE_ACCESS_TOKEN / _PROJECT_REF / _DB_PASSWORD / _URL

on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight deploy — a half-applied migration set is worse
  # than waiting. Queue subsequent runs instead.
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Gate: production deploys only on a commit whose CI is actually green.
  # deploy.yml triggers on push to master and would otherwise run concurrently
  # with test.yml / migrations-ci.yml for the same SHA — a direct push or an
  # admin-bypassed PR could ship before (or instead of) those passing. This job
  # waits for the substantive validators to conclude for THIS SHA and fails
  # closed if any is red or never finishes. A manual `workflow_dispatch` skips
  # the gate (the operator chose the ref deliberately).
  preflight:
    name: Require CI green for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for required workflows to pass on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::notice title=Preflight::manual dispatch — skipping the CI-green gate"
            {
              echo "## Preflight ⏭️"
              echo ""
              echo "- Manual dispatch: the CI-green gate is skipped (operator chose the ref)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The substantive validators for everything this deploy ships. CodeQL
          # is intentionally NOT here: it never fails a build (findings only),
          # so gating on it would block deploys on advisory output.
          required=("Tests" "Migrations CI")

          deadline=$(( $(date +%s) + 25 * 60 ))
          while :; do
            runs=$(gh api --paginate \
              "repos/${REPO}/actions/runs?head_sha=${SHA}" \
              --jq '.workflow_runs[] | [.name, .status, .conclusion] | @tsv')

            pending=""
            for wf in "${required[@]}"; do
              line=$(printf '%s\n' "$runs" | awk -F'\t' -v n="$wf" '$1 == n {print; exit}')
              if [ -z "$line" ]; then
                pending="${pending} ${wf}(no-run-yet)"
                continue
              fi
              status=$(printf '%s' "$line" | cut -f2)
              conclusion=$(printf '%s' "$line" | cut -f3)
              if [ "$status" != "completed" ]; then
                pending="${pending} ${wf}(${status})"
                continue
              fi
              if [ "$conclusion" != "success" ]; then
                echo "::error title=Preflight::${wf} concluded '${conclusion}' for ${SHA} — refusing to deploy. Fix CI on master, then re-run this deploy."
                exit 1
              fi
            done

            if [ -z "$pending" ]; then
              echo "::notice title=Preflight::all required workflows green for ${SHA}"
              {
                echo "## Preflight ✅"
                echo ""
                echo "- Required workflows green for \`${SHA}\`: ${required[*]}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=Preflight::timed out waiting for:${pending}. Failing closed — deploy proceeds only once CI is green for this commit (or via manual dispatch)."
              exit 1
            fi
            echo "waiting for:${pending}"
            sleep 30
          done

  # Optional pre-production stage. Inert until a staging Supabase project
  # exists: set the repo variable STAGING_ENABLED=true and add the four
  # STAGING_SUPABASE_* secrets on a `staging` Environment. Until then this job
  # is skipped and production deploys exactly as before. Runs the same
  # migrate → deploy → contract-suite path as production against a throwaway
  # project, so a migration that only breaks against real data fails here
  # first — the rehearsal the local stack in migrations-ci can't give.
  deploy-staging:
    name: Deploy to staging
    needs: preflight
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: "2.116.0"

      - name: Migrate, deploy functions, contract-test
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing="${missing} STAGING_SUPABASE_ACCESS_TOKEN"
          [ -z "${SUPABASE_PROJECT_REF:-}" ]  && missing="${missing} STAGING_SUPABASE_PROJECT_REF"
          [ -z "${SUPABASE_DB_PASSWORD:-}" ]  && missing="${missing} STAGING_SUPABASE_DB_PASSWORD"
          [ -z "${SUPABASE_URL:-}" ]          && missing="${missing} STAGING_SUPABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error title=Staging::STAGING_ENABLED is true but these secrets are not set on the staging Environment:${missing}"
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          echo "Pending migrations (staging):"
          supabase db push --dry-run
          supabase db push
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          for _ in $(seq 1 10); do
            if curl -fsS --max-time 15 "${SUPABASE_URL}/functions/v1/api-health" \
              | jq -e '.status == "ok"' >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done
          # Same six-endpoint contract suite the production smoke test runs.
          bash scripts/check-endpoints.sh "${SUPABASE_URL}/functions/v1" "Staging" /tmp/staging-results.md

  deploy:
    name: Deploy
    needs: [preflight, deploy-staging]
    # preflight must pass; staging must have passed OR been skipped (it is
    # skipped whenever STAGING_ENABLED is not 'true').
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Single gate for the whole deploy: one required-reviewer approval covers
    # migrations + functions. All environment-scoped secrets are available to
    # the job once approved.
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Pinned, not "latest" (setup-cli's default): this is the ONLY
          # workflow that runs `supabase db push` against PRODUCTION, so a
          # silent CLI upgrade changing push/dry-run semantics is the worst
          # kind of surprise here. Bump deliberately — the weekly
          # toolchain-freshness check tracks the latest release.
          version: "2.116.0"

      - name: Back up database (restore point)
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          # This deploy is fix-forward with NO automated rollback, and the
          # project's plan has no point-in-time recovery. A logical dump taken
          # here is the restore point: if a migration corrupts data, decrypt and
          # `psql "$DB_URL" -f pre-deploy-schema.sql -f pre-deploy-data.sql`.
          #
          # The dump is taken with the project DB password, so it contains EVERY
          # column of every table — including the ones C-GRANT keeps service-role
          # only (url_hash, backfill state, fetch_logs, operational sources
          # columns). A plain upload-artifact is readable by anyone with repo
          # (Actions) read access — far wider than the production Environment's
          # required-reviewer gate — so the dump is symmetrically encrypted with
          # a key that lives only on the production Environment before it leaves
          # this step. Decrypt with:
          #   openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_ENCRYPTION_KEY \
          #     -in pre-deploy-data.sql.enc -out pre-deploy-data.sql
          # The roles dump is deliberately NOT taken: Supabase manages anon/
          # authenticated/service_role/authenticator, they are never restored
          # from here, and a pg_dumpall-style role export can carry password
          # verifiers.
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error title=Deploy::SUPABASE_DB_PASSWORD is not set on the production environment — cannot take a pre-deploy backup. Refusing to continue."
            exit 1
          fi
          if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then
            echo "::error title=Deploy::BACKUP_ENCRYPTION_KEY is not set on the production environment. The pre-deploy backup contains service-role-only columns and must be encrypted before upload — add the secret (e.g. \`openssl rand -base64 32\`) under Settings → Environments → production."
            exit 1
          fi

          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          work=$(mktemp -d)
          mkdir -p /tmp/backup
          supabase db dump --linked -f "$work/pre-deploy-schema.sql"
          supabase db dump --linked --data-only -f "$work/pre-deploy-data.sql"
          for f in pre-deploy-schema.sql pre-deploy-data.sql; do
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_ENCRYPTION_KEY \
              -in "$work/$f" -out "/tmp/backup/${f}.enc"
          done
          rm -rf "$work"
          ls -l /tmp/backup

      - name: Upload pre-deploy backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pre-deploy-backup-${{ github.sha }}
          path: /tmp/backup/*.enc
          retention-days: 30
          if-no-files-found: error

      - name: Apply migrations
        shell: bash
        run: |
          set -euo pipefail

          # SUPABASE_DB_PASSWORD lives on the production environment and is
          # required by `supabase db push`. Fail loudly if it's missing rather
          # than shipping Edge Functions without their migrations — applying
          # migrations FIRST, under set -e, is the whole point of this job.
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error title=Deploy::SUPABASE_DB_PASSWORD is not set on the production environment. Refusing to deploy functions without applying pending migrations — add it under Settings → Environments → production."
            exit 1
          fi

          # The CLI reads SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD from env.
          # `db push` applies pending migrations to the linked project. A failure
          # here aborts the job (set -e) before functions deploy.
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          # Dry run first. Migrations CI proves the set applies from SCRATCH;
          # only this sees production's actual migration history, so it is the
          # first point at which unexpected drift (a migration applied by hand,
          # a gap, a file whose checksum no longer matches what was recorded)
          # becomes visible. It also puts the exact list of migrations about to
          # run into the log — which, given there is no rollback, is the record
          # you want when diagnosing a bad release.
          echo "Pending migrations:"
          supabase db push --dry-run

          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # Wait for api-health before the full sweep: freshly deployed functions
      # take a few seconds to go live, and there is no point failing five
      # endpoints when the real answer is "not up yet". Once this returns
      # healthy the deploy has landed and the remaining endpoints are expected
      # to answer immediately.
      - name: Wait for deploy to go live (api-health)
        shell: bash
        run: |
          set -euo pipefail

          # api-health is verify_jwt = false and returns exactly {"status":"ok"}.
          url="${SUPABASE_URL}/functions/v1/api-health"
          attempts=5
          for i in $(seq 1 "$attempts"); do
            body=""
            if body=$(curl -fsS --max-time 15 "$url"); then
              # Parse the JSON and require status == "ok" exactly. A substring
              # match (grep '"ok"') would also pass bodies like
              # {"status":"error","ok_count":0}; jq -e fails on non-ok / non-JSON.
              if printf '%s' "$body" | jq -e '.status == "ok"' >/dev/null 2>&1; then
                echo "api-health healthy on attempt ${i}: ${body}"
                exit 0
              fi
              echo "Attempt ${i}/${attempts}: HTTP 200 but body not healthy yet: ${body}"
            else
              echo "Attempt ${i}/${attempts}: api-health not reachable yet"
            fi
            if [ "$i" -lt "$attempts" ]; then
              sleep 3
            fi
          done

          echo "::error title=Deploy::api-health did not return healthy after deploy"
          exit 1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      # api-health touches almost nothing — it is a liveness probe, not a
      # contract test. On its own it would go green while a broken migration
      # took out `articles_with_source`, or a syntax error shipped in
      # api-search. Since this deploy is deliberately fix-forward with NO
      # rollback, the smoke test is the only signal that the release is good,
      # so it exercises every endpoint the iOS app actually calls: status,
      # response shape, and the documented Cache-Control.
      #
      # All six functions are verify_jwt = false (supabase/config.toml), so no
      # auth header is needed. Every endpoint is a plain GET with no side
      # effects — running this against production is a read-only operation.
      - name: Smoke test (all endpoints)
        id: smoke
        shell: bash
        run: |
          set -uo pipefail

          # The six-endpoint contract suite (status, body shape, Cache-Control)
          # lives in scripts/check-endpoints.sh — the SAME file the PR contract
          # test in migrations-ci.yml runs against the local stack, so "same
          # assertions as the PR check" is structural, not a copy. The suite
          # emits its own ::error annotations and results table; this step
          # captures the table for the annotate step below and propagates the
          # suite's exit code.
          rc=0
          bash scripts/check-endpoints.sh "${SUPABASE_URL}/functions/v1" "Smoke test" /tmp/smoke-results.md || rc=$?

          {
            echo "smoke_results<<RESULTS_EOF"
            cat /tmp/smoke-results.md 2>/dev/null || true
            echo "RESULTS_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$rc" -ne 0 ]; then
            echo "::error title=Deploy::one or more endpoints failed the post-deploy smoke test"
            exit 1
          fi
          echo "All 6 endpoints passed the smoke test."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      # if: always() so we annotate on both paths. Branch on job.status: green
      # when every prior step passed, red otherwise. No secrets in the output.
      - name: Annotate deploy
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          SMOKE_RESULTS: ${{ steps.smoke.outputs.smoke_results }}
        run: |
          set -euo pipefail

          # On success the migrate step always ran `supabase db push` (a missing
          # secret or a failed push aborts the job before this annotation).
          migrate_line="Migrations applied via \`supabase db push\`"

          # Rendered on both paths. Empty when the job died before the smoke
          # step ran (e.g. a failed migration), which is itself informative.
          # SMOKE_RESULTS already carries the header + separator row
          # (check-endpoints.sh writes both into the results file) — echo it
          # verbatim, or the table renders a stray header in its body.
          smoke_table() {
            if [ -n "${SMOKE_RESULTS:-}" ]; then
              echo ""
              printf '%s\n' "$SMOKE_RESULTS"
            fi
          }

          if [ "$JOB_STATUS" = "success" ]; then
            echo "::notice title=Deploy::${migrate_line}; functions deployed; all 6 endpoints passed the smoke test"
            {
              echo "## Deploy ✅"
              echo ""
              echo "- ${migrate_line}"
              echo "- Edge Functions deployed to the production project"
              echo "- Smoke test: all 6 endpoints returned 200 with the expected shape and \`Cache-Control\`"
              smoke_table
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Deploy::deploy failed — see the step annotations above"
            {
              echo "## Deploy ❌"
              echo ""
              echo "Deploy failed — see the step annotations above."
              echo ""
              echo "> This deploy is fix-forward: migrations and functions that already"
              echo "> applied are still live. Fix and re-deploy; do not expect a rollback."
              smoke_table
            } >> "$GITHUB_STEP_SUMMARY"
          fi
