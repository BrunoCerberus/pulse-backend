name: Source Health Watchdog

# Polls the api-source-health endpoint on a schedule and fails the job when
# thresholds are exceeded. A failed workflow triggers GitHub's built-in email
# notifications to repo watchers — no external alerting service needed.
#
# Thresholds below are intentionally generous for the default fleet of ~133
# sources. Fetch freshness is tighter because it detects scheduler-wide stalls.

on:
  schedule:
    # Hourly at :15 past the hour (staggered from the every-2h fetch cron).
    # Hourly rather than 2-hourly so a scheduler-wide stall or a broken worker
    # binary on master surfaces within ~1h instead of ~3h — the job is cheap
    # (one HTTP call) and the thresholds already tolerate a single missed fetch.
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# One health check at a time; a manual dispatch shouldn't double up with the
# 2-hourly cron.
concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: Check source health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      # The service-role key is NOT sent to api-source-health: that function
      # is `verify_jwt = false` and reads source_health with its own key, and
      # sending a JWT to it was a leak vector (function logs captured the
      # bearer). The key is used only for the direct DB-size RPC call below,
      # scoped to the step that makes it.
      # Thresholds — fail the job when any of these are exceeded.
      # Calibrated post-cleanup (migration 023 inactivated 16 dead sources).
      # Baseline floor on 2026-05-12 after cleanup: circuit_open=1, stale=23,
      # high_failure=0. Headroom of ~4-7 sources before alert fires:
      #   - stale at 23 → 27 catches widespread degradation, tolerates monthly
      #     podcasts that happen to be at the bottom of their cycle.
      #   - circuit_open at 1 → 8 absorbs transient network/DNS blips without
      #     false-paging, fires on real outages.
      MAX_CIRCUIT_OPEN: 8
      MAX_STALE: 27
      MAX_HIGH_FAILURE: 15
      # DB size as a % of quota. Free tier is 500 MB; the May 2026 cleanup
      # (search_vector + unused-index drops) brought us from 41% to 21%, so
      # this can tighten from 70% → 60% (~300 MB) for earlier warning while
      # still leaving ~200 MB of headroom before Supabase restricts the project
      # (which is what the April 2026 incident hit at 100%).
      MAX_DB_QUOTA_PCT: 60
      DB_QUOTA_BYTES: 524288000
      # The ingestion workflow is scheduled every two hours. Alert after one missed
      # interval plus one hour of scheduler/runtime headroom.
      MAX_FETCH_AGE_MINUTES: 180

    steps:
      - name: Query source health
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          # Hit the Edge Function — no auth header needed (verify_jwt = false).
          response=$(curl -fsS --max-time 30 \
            "${SUPABASE_URL}/functions/v1/api-source-health")

          echo "Summary:"
          echo "$response" | jq '.summary'

          circuit_open=$(echo "$response" | jq -r '.summary.circuit_open_count')
          stale=$(echo "$response" | jq -r '.summary.stale_count')
          high_failure=$(echo "$response" | jq -r '.summary.high_failure_count')
          fetch_age_minutes=$(echo "$response" | jq -r '.summary.fetch_age_minutes // empty')
          latest_successful_fetch_at=$(echo "$response" | jq -r '.summary.latest_successful_fetch_at // empty')

          # Validate everything is a non-negative integer before arithmetic.
          # Anything else is treated as missing (the `fail=0` default holds
          # unless we explicitly trip a threshold) so a broken upstream
          # never silently passes thresholds.
          int_re='^[0-9]+$'
          for v in circuit_open stale high_failure; do
            val=${!v}
            if ! [[ "$val" =~ $int_re ]]; then
              echo "::error title=Watchdog input::expected integer for $v, got '$val'"
              exit 1
            fi
          done
          if ! [[ "$fetch_age_minutes" =~ $int_re ]]; then
            echo "::error title=Fetch freshness::missing or invalid fetch_age_minutes — latest successful fetch: ${latest_successful_fetch_at:-unknown}"
            exit 1
          fi

          fail=0
          if (( circuit_open > MAX_CIRCUIT_OPEN )); then
            echo "::error title=Circuit breaker::circuit_open_count=${circuit_open} exceeds threshold ${MAX_CIRCUIT_OPEN}"
            fail=1
          fi
          if (( stale > MAX_STALE )); then
            echo "::error title=Stale sources::stale_count=${stale} exceeds threshold ${MAX_STALE}"
            fail=1
          fi
          if (( high_failure > MAX_HIGH_FAILURE )); then
            echo "::error title=High failure count::high_failure_count=${high_failure} exceeds threshold ${MAX_HIGH_FAILURE}"
            fail=1
          fi

          # DB size comes from the service-role-only RPC, not the public
          # endpoint: migration 027 revoked it from anon because it tells an
          # attacker filling the database how close the quota is. This repo's
          # Actions logs are public too, so only ok / over / n/a is printed,
          # never the size. The key goes to curl on stdin, not in its argv.
          # A refused key or a missing function (401/403/404) fails the job:
          # those persist, so the alarm would otherwise stay off unnoticed
          # after a key rotation. A timeout / 5xx / 429 only warns (n/a), so a
          # transient RPC error doesn't page.
          db_status="n/a"
          db_body=$(mktemp)
          db_code=$(printf 'header = "apikey: %s"\nheader = "Authorization: Bearer %s"\n' \
              "$SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_SERVICE_ROLE_KEY" |
            curl -sS --max-time 30 -K - -o "$db_body" -w '%{http_code}' -X POST \
              -H "Content-Type: application/json" -d '{}' \
              "${SUPABASE_URL}/rest/v1/rpc/get_db_size_bytes" || true)
          db_bytes=$(cat "$db_body")
          if [[ "$db_code" == "200" && "$db_bytes" =~ $int_re ]]; then
            if (( db_bytes * 100 > DB_QUOTA_BYTES * MAX_DB_QUOTA_PCT )); then
              db_status="over"
              echo "::error title=DB quota::database size exceeds ${MAX_DB_QUOTA_PCT}% of quota; check usage in the Supabase dashboard"
              fail=1
            else
              db_status="ok"
            fi
          elif [[ "$db_code" =~ ^(401|403|404)$ ]]; then
            db_status="error"
            echo "::error title=DB quota::database size check refused (HTTP ${db_code}), so the quota alarm is off; check the SUPABASE_SERVICE_ROLE_KEY secret and get_db_size_bytes grant"
            fail=1
          else
            echo "::warning title=DB quota::database size check unavailable (HTTP ${db_code:-none}); the quota alarm did not run"
          fi
          if (( fetch_age_minutes > MAX_FETCH_AGE_MINUTES )); then
            echo "::error title=Fetch freshness::latest successful fetch was ${fetch_age_minutes}m ago (${latest_successful_fetch_at}), exceeds ${MAX_FETCH_AGE_MINUTES}m"
            fail=1
          fi

          # Shared metrics table for the Job Summary (rendered on both paths).
          metrics_table() {
            echo "| Metric | Value | Threshold |"
            echo "|--------|-------|-----------|"
            echo "| circuit_open | ${circuit_open} | ${MAX_CIRCUIT_OPEN} |"
            echo "| stale | ${stale} | ${MAX_STALE} |"
            echo "| high_failure | ${high_failure} | ${MAX_HIGH_FAILURE} |"
            echo "| db_quota | ${db_status} | ${MAX_DB_QUOTA_PCT}% |"
            echo "| fetch_age_minutes | ${fetch_age_minutes} | ${MAX_FETCH_AGE_MINUTES} |"
          }

          if (( fail == 1 )); then
            {
              echo "## Source Health Watchdog ❌"
              echo ""
              echo "One or more thresholds exceeded — see the annotations above."
              echo ""
              metrics_table
            } >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "Sources triggering the alert:"
            echo "$response" | jq '.sources | map(select(
              .circuit_open == true or
              .consecutive_failures >= 3 or
              (.is_active and .articles_last_24h == 0)
            ))'
            exit 1
          fi

          # Success: populate the Annotations box (notice) + the Job Summary.
          echo "::notice title=Source Health::OK — circuit_open=${circuit_open}/${MAX_CIRCUIT_OPEN}, stale=${stale}/${MAX_STALE}, high_failure=${high_failure}/${MAX_HIGH_FAILURE}, fetch_age=${fetch_age_minutes}m/${MAX_FETCH_AGE_MINUTES}m, db_quota=${db_status}"
          {
            echo "## Source Health Watchdog ✅"
            echo ""
            metrics_table
          } >> "$GITHUB_STEP_SUMMARY"
